#
# Replaces 050-sway.conf, which leaves the image together with sway. Everything
# here except the display name is carried over verbatim - those exports are load
# bearing well outside the compositor (ppsspp segfaults without SDL_VIDEODRIVER,
# and XKB_CONFIG_ROOT is how anything gets a keymap).

export XDG_RUNTIME_DIR=/var/run/0-runtime-dir

# this lets ppsspp to work with wayland and not segfault
export SDL_VIDEODRIVER=wayland
export SDL_AUDIODRIVER=pulseaudio
export XKB_CONFIG_ROOT=/usr/share/X11/xkb

# WAYLAND_DISPLAY is deliberately NOT hardcoded here, unlike the sway version
# which pinned it to wayland-1.
#
# gamescope picks its own socket name and only reveals it through the -R
# handshake, so a fixed value would be wrong in two directions at once: the
# client would look for a compositor that is not there, and gamescope itself
# would see a WAYLAND_DISPLAY in its environment on startup and quietly come up
# nested inside a compositor that does not exist instead of taking over DRM.
#
# The session publishes the real names here once it is up.
if [ -r /var/run/gamescope/env ]; then
  . /var/run/gamescope/env
  export DISPLAY WAYLAND_DISPLAY GAMESCOPE_WAYLAND_DISPLAY
fi
