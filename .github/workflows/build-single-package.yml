name: Build single package

# Build one package and hand back just its binaries, so a compositor-level fix
# can be tried on the device without waiting ~14h for a whole image. The build
# system still pulls in whatever that package depends on, but that is a small
# fraction of a full run: no kernel, no emulators, no Qt.
#
# Drop the result over the read-only /usr on the device with a bind mount.

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: "Package to build (e.g. gamescope)"
        type: string
        required: true
        default: gamescope
      DEVICE:
        description: "Device"
        type: string
        required: true
        default: SM8550

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      EMULATION_DEVICE: no
      ENABLE_32BIT: no
      MODULES_PKG: no
      JAVA_HOME: /usr
      PROJECT: ROCKNIX
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Docker image references have to be lowercase; the image jobs get this
      # passed in as OWNER_LC, and workflow_dispatch has no caller to do that.
      - name: Lowercase repository owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"

      - name: Retrieve ccache
        run: |
          URL="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache/ccache-aarch64-${{ inputs.DEVICE }}.tar"
          curl -L --fail --silent --show-error "$URL" | tar -xf - || echo "Cache archive not found, building cold."

      - name: Build ${{ inputs.PACKAGE }}
        timeout-minutes: 330
        run: |
          ./scripts/get_env > .env
          set -e
          { docker run --init --env-file .env --rm --user $(id -u):$(id -g) \
              -v ${PWD}:${PWD} -w ${PWD} \
              "ghcr.io/${{ env.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build ${{ inputs.PACKAGE }}"; echo $? > docker_exit_code; } \
            | tee output.log | grep -E --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
          exit_code=$(<docker_exit_code)
          exit $exit_code

      # Collect without assuming a layout: the first attempt guessed
      # <build>/<pkg>-<version>/.install_pkg, found nothing, and threw away a
      # 2.5h compile. Print what is actually there, then take the package's
      # build directory wholesale.
      - name: Collect built binaries
        if: always()
        run: |
          BUILD_DIR="build.ROCKNIX-${{ inputs.DEVICE }}.aarch64"
          PKG="${{ inputs.PACKAGE }}"
          mkdir -p out

          echo "=== top of ${BUILD_DIR} ==="
          ls -la "${BUILD_DIR}" 2>/dev/null | head -40 || echo "(no build dir)"

          echo "=== package dirs ==="
          find "${BUILD_DIR}" -maxdepth 1 -iname "${PKG}*" -print 2>/dev/null || true

          echo "=== every file named ${PKG} ==="
          find "${BUILD_DIR}" -name "${PKG}" -type f -print 2>/dev/null | head -20 || true

          echo "=== every .install_pkg ==="
          find "${BUILD_DIR}" -maxdepth 3 -type d -name ".install_pkg" -print 2>/dev/null | head -20 || true

          # Whole build directory for the package - small, and guaranteed to
          # contain the binary wherever the build system put it.
          PKGDIR="$(find "${BUILD_DIR}" -maxdepth 1 -type d -iname "${PKG}-*" | head -1)"
          if [ -n "${PKGDIR}" ]; then
            echo "packing ${PKGDIR}"
            tar -C "$(dirname "${PKGDIR}")" -czf "out/${PKG}-builddir.tar.gz" "$(basename "${PKGDIR}")"
          fi

          # Plus any installed copy, wherever it ended up.
          find "${BUILD_DIR}" -path "*/usr/bin/${PKG}" -type f -print 2>/dev/null \
            | while IFS= read -r f; do
                echo "found installed: ${f}"
                cp "${f}" "out/${PKG}.$(echo "${f}" | md5sum | cut -c1-8)" || true
              done

          ls -la out/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.PACKAGE }}-${{ inputs.DEVICE }}
          path: out/
          if-no-files-found: warn

      - name: Archive logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.PACKAGE }}-${{ inputs.DEVICE }}
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        if: always()
        run: |
          BUILD_DIR="build.ROCKNIX-${{ inputs.DEVICE }}.aarch64"
          export CCACHE_DIR=./${BUILD_DIR}/.ccache
          ./${BUILD_DIR}/toolchain/bin/ccache -M 2G || true
          ./${BUILD_DIR}/toolchain/bin/ccache -c || true
          ./${BUILD_DIR}/toolchain/bin/ccache -s -v || true

      - name: Tar ccache
        if: always()
        run: |
          tar --remove-files -cf ccache-aarch64-${{ inputs.DEVICE }}.tar \
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache || true

      - name: Save ccache
        if: always()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: ccache-aarch64-${{ inputs.DEVICE }}.tar
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true
